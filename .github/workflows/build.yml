name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-latest
            label: macos-arm64
          # No macos-13 (Intel) job. Those runners are scarce enough that the
          # job sat queued for half an hour, and `release` needs this one, so a
          # job that never gets a runner would block every release rather than
          # just being slow. Intel Macs: build from source, it is two commands.
          - os: windows-latest
            label: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # PC/SC is part of macOS and Windows. Only Linux needs headers, and only
      # to build pyscard — which publishes wheels for the other two.
      - name: Install PC/SC headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev

      - name: Install dependencies
        run: pip install pyinstaller pythaiidcard websockets

      - name: Build
        run: pyinstaller packaging/thaiid-agent.spec

      # The real check that the matrix produced something that works: --selftest
      # needs no reader and no network, but it does exercise the bundled
      # reader.html over a real socket, so a broken --add-data fails here rather
      # than in someone's hands.
      - name: Smoke test (POSIX)
        if: runner.os != 'Windows'
        run: ./dist/thaiid-agent --selftest

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: .\dist\thaiid-agent.exe --selftest

      - name: Name the binary for its platform
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/thaiid-agent.exe "out/thaiid-agent-${{ matrix.label }}.exe"
          else
            cp dist/thaiid-agent "out/thaiid-agent-${{ matrix.label }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: thaiid-agent-${{ matrix.label }}
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            Download the binary for your platform, run it, open
            <http://127.0.0.1:8765> and insert a card.

            **Prerequisites** — PC/SC is built into macOS and Windows, so there
            is nothing to install. On Linux:

            ```sh
            sudo apt install pcscd libpcsclite1
            sudo systemctl enable --now pcscd
            ```

            **The binaries are unsigned**, so each OS objects once:

            - macOS — `xattr -d com.apple.quarantine thaiid-agent-macos-arm64`
            - Windows — SmartScreen → More info → Run anyway
            - Linux — `chmod +x thaiid-agent-linux-x86_64`

            **Intel Macs** have no binary here: an Apple Silicon build will not
            run on Intel, and GitHub's Intel runners are too scarce to depend
            on. Build from source instead — see the README.

            To start it at login, see `packaging/` — a systemd user unit, a
            launchd LaunchAgent, and a per-user scheduled task for Windows.
